<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080">
  <title>GTA VI meme — waited 13 years</title>
  <defs>
    <style>
      @font-face {
        font-family: 'Anton';
        src: url('assets/Anton-Regular.woff2') format('woff2');
        font-weight: 400;
        font-style: normal;
      }
      .caption { font-family: 'Anton', 'Arial Black', sans-serif; fill: #ffffff; stroke: #0d0618; stroke-width: 10; paint-order: stroke; text-anchor: middle; }
      .wordmark { font-family: 'Anton', 'Arial Black', sans-serif; fill: #ffffff; text-anchor: middle; }
    </style>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e0b3d"/>
      <stop offset="0.34" stop-color="#7b1e6e"/>
      <stop offset="0.58" stop-color="#e84393"/>
      <stop offset="0.78" stop-color="#ff7a3d"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7c0"/>
      <stop offset="0.55" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff6b35"/>
    </radialGradient>
    <linearGradient id="vi" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f7cff"/>
      <stop offset="0.38" stop-color="#c44dff"/>
      <stop offset="0.68" stop-color="#ff4d9d"/>
      <stop offset="1" stop-color="#ff7a1a"/>
    </linearGradient>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a2a6e"/>
      <stop offset="1" stop-color="#120a2e"/>
    </linearGradient>
  </defs>

  <!-- Vice City sunset sky -->
  <rect x="0" y="0" width="1080" height="680" fill="url(#sky)"/>

  <!-- Sun on the horizon -->
  <circle cx="540" cy="680" r="140" fill="url(#sun)"/>

  <!-- Ocean strip with a sun reflection -->
  <rect x="0" y="680" width="1080" height="80" fill="url(#sea)"/>
  <ellipse cx="540" cy="700" rx="180" ry="10" fill="#ffd166" opacity="0.55"/>
  <ellipse cx="540" cy="722" rx="120" ry="7" fill="#ff9a3d" opacity="0.4"/>

  <!-- Palm silhouettes framing the scene -->
  <g fill="none" stroke="#0d0618" stroke-linecap="round">
    <!-- left palm -->
    <path d="M120 760 C 110 640, 95 540, 130 430" stroke-width="20"/>
    <path d="M130 430 C 90 380, 40 370, 10 400" stroke-width="15"/>
    <path d="M130 430 C 120 360, 90 320, 45 315" stroke-width="15"/>
    <path d="M130 430 C 150 350, 180 310, 235 300" stroke-width="15"/>
    <path d="M130 430 C 175 385, 225 375, 260 400" stroke-width="15"/>
    <path d="M130 430 C 140 350, 160 300, 200 275" stroke-width="13"/>
    <!-- right palm -->
    <path d="M960 760 C 970 640, 985 540, 950 430" stroke-width="20"/>
    <path d="M950 430 C 990 380, 1040 370, 1070 400" stroke-width="15"/>
    <path d="M950 430 C 960 360, 990 320, 1035 315" stroke-width="15"/>
    <path d="M950 430 C 930 350, 900 310, 845 300" stroke-width="15"/>
    <path d="M950 430 C 905 385, 855 375, 820 400" stroke-width="15"/>
    <path d="M950 430 C 940 350, 920 300, 880 275" stroke-width="13"/>
  </g>

  <!-- The giant VI in the sky, gradient like the GTA VI logo -->
  <text x="540" y="600" font-family="Anton, 'Arial Black', sans-serif" font-size="420" text-anchor="middle" fill="url(#vi)" stroke="#0d0618" stroke-width="18" paint-order="stroke">VI</text>
  <text x="540" y="600" font-family="Anton, 'Arial Black', sans-serif" font-size="420" text-anchor="middle" fill="none" stroke="#ffffff" stroke-width="3" paint-order="stroke" opacity="0.85">VI</text>

  <!-- Caption: the wait -->
  <text x="540" y="135" class="caption" font-size="96">WAITED 13 YEARS</text>
  <text x="540" y="225" class="caption" font-size="56">FOR</text>

  <!-- Foreground: the curb where they wait -->
  <rect x="0" y="760" width="1080" height="320" fill="#14082a"/>
  <rect x="0" y="760" width="1080" height="4" fill="#2c1650"/>

  <!-- Ground shadows -->
  <ellipse cx="430" cy="1015" rx="130" ry="18" fill="#000000" opacity="0.45"/>
  <ellipse cx="665" cy="1015" rx="130" ry="18" fill="#000000" opacity="0.45"/>

  <!-- The waiter: a lone figure, back view, knees drawn up.
       A warm rim-light edge so the silhouette reads against the dark curb. -->
  <g fill="#0d0618" stroke="#ff9a3d" stroke-width="5" stroke-linejoin="round">
    <circle cx="430" cy="828" r="36"/>
    <path d="M 385,1010 C 385,925 392,878 430,872 C 468,878 475,925 475,1010 Z"/>
    <ellipse cx="402" cy="972" rx="27" ry="40"/>
    <ellipse cx="458" cy="972" rx="27" ry="40"/>
  </g>

  <!-- The make.fun ghost, waiting beside them -->
  <!-- magenta disc it sits on -->
  <ellipse cx="665" cy="1012" rx="118" ry="20" fill="#ff2e88" opacity="0.9"/>
  <g transform="translate(665, 800)">
    <!-- ghost body: white, thick black outline, wavy hem -->
    <path d="M -75,205 L -75,75 A 75,75 0 0 1 75,75 L 75,205 Q 56,183 37,205 Q 19,183 0,205 Q -19,183 -37,205 Q -56,183 -75,205 Z"
          fill="#ffffff" stroke="#0d0618" stroke-width="9" stroke-linejoin="round"/>
    <!-- four-pointed sparkle eyes -->
    <path d="M -28,62 L -24,74 L -12,78 L -24,82 L -28,94 L -32,82 L -44,78 L -32,74 Z" fill="#0d0618"/>
    <path d="M 28,62 L 32,74 L 44,78 L 32,82 L 28,94 L 24,82 L 12,78 L 24,74 Z" fill="#0d0618"/>
    <!-- round little hand, holding the coin up -->
    <circle cx="82" cy="128" r="15" fill="#ffffff" stroke="#0d0618" stroke-width="7"/>
    <!-- magenta coin with a white star -->
    <g transform="translate(104, 92)">
      <circle r="30" fill="#ff2e88" stroke="#0d0618" stroke-width="6"/>
      <path d="M 0,-16 L 3.8,-5.3 L 15.2,-4.9 L 6.2,2 L 9.4,12.9 L 0,6.5 L -9.4,12.9 L -6.2,2 L -15.2,-4.9 L -3.8,-5.3 Z" fill="#ffffff"/>
    </g>
  </g>

  <!-- Brand signature -->
  <text x="540" y="1058" class="wordmark" font-size="42">make.fun</text>
</svg>
